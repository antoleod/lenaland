      <stop offset="0.45" stop-color="#B367FF"/>
      <stop offset="0.75" stop-color="#FF69D4"/>
      <stop offset="1" stop-color="#FFE36F"/>
    </linearGradient>
    <linearGradient id="faceOrange" x1="270" y1="232" x2="770" y2="736">
      <stop stop-color="#FFC35A"/>
      <stop offset="0.55" stop-color="#F6A63F"/>
      <stop offset="1" stop-color="#E98235"/>
