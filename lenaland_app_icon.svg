      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.35  0 0 0 0 1  0 0 0 0.75 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect x="96" y="96" width="832" height="832" rx="180"/>
    </clipPath>
  </defs>

